name: Build MicroPython Firmware

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tzdata
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y git build-essential cmake ninja-build ccache dfu-util libffi-dev libssl-dev libusb-1.0-0-dev python3-pip

    - name: Clone MicroPython
      run: |
        git clone --depth 1 -b v1.22.0 https://github.com/micropython/micropython.git
        cd micropython
        git submodule update --init lib/pico-sdk || true
        make -C mpy-cross

    - name: Install ESP-IDF (v5.0.2 Match MicroPython 1.22)
      run: |
        git clone -b v5.0.2 --recursive https://github.com/espressif/esp-idf.git ~/esp-idf
        cd ~/esp-idf
        # 1. 运行官方完整安装脚本（自动补齐全部 Python 依赖包）
        ./install.sh esp32s3
        # 2. 强行修复 setuptools API 变动问题
        /home/runner/.espressif/python_env/idf5.0_py3.10_env/bin/python -m pip install "setuptools<70.0.0"

    - name: Copy Modules and Build Firmware
      run: |
        # 1. 激活乐鑫官方环境变量
        source ~/esp-idf/export.sh
        
        # 2. 补全 ESP-IDF requirements 文件中的所有依赖
        python -m pip install -r ~/esp-idf/tools/requirements/requirements.core.txt
        
        # 3. 复制 Python 代码到冻结模块目录
        cp -r modules/* micropython/ports/esp32/modules/
        
        # 4. 编译适配 N16R8 (8MB PSRAM) 的 ESP32-S3 固件
        cd micropython/ports/esp32
        make BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT submodules
        make BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-n16r8-frozen-firmware
        path: micropython/ports/esp32/build-ESP32_GENERIC_S3-SPIRAM_OCT/firmware.bin