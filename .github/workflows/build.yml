name: Build MicroPython Firmware

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential cmake ninja-build ccache dfu-util

    - name: Clone MicroPython
      run: |
        git clone --recursive https://github.com/micropython/micropython.git
        cd micropython
        git checkout v1.22.0
        make -C mpy-cross

    - name: Setup ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp-idf-version: 'v5.0.4'

    - name: Copy Modules and Build Firmware
      run: |
        # 1. 复制 modules 目录下的 Python 代码到冻结模块路径
        cp -r modules/* micropython/ports/esp32/modules/
        
        # 2. 编译支持 8MB PSRAM (SPIRAM_OCT) 的 ESP32-S3 固件
        cd micropython/ports/esp32
        make BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT submodules
        make BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-n16r8-frozen-firmware
        path: micropython/ports/esp32/build-ESP32_GENERIC_S3-SPIRAM_OCT/firmware.bin