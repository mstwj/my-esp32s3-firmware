name: Build MicroPython Firmware

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: espressif/idf:v5.0.4

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y git build-essential cmake ninja-build ccache dfu-util python3-pip

    - name: Clone MicroPython
      run: |
        git clone --recursive https://github.com/micropython/micropython.git
        cd micropython
        git checkout v1.22.0
        make -C mpy-cross

    - name: Copy Modules and Build Firmware
      run: |
        # 1. 导入 ESP-IDF 环境变量
        . $IDF_PATH/export.sh
        
        # 2. 复制你的 Python 代码到冻结模块目录
        cp -r modules/* micropython/ports/esp32/modules/
        
        # 3. 编译适配 N16R8 (8MB PSRAM) 的 ESP32-S3 固件
        cd micropython/ports/esp32
        make BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT submodules
        make BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-n16r8-frozen-firmware
        path: micropython/ports/esp32/build-ESP32_GENERIC_S3-SPIRAM_OCT/firmware.bin